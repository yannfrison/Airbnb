const urlParams = new URLSearchParams(window.location.search);
let langue = urlParams.get('lang') || 'fr';
if (langue !== 'fr' && langue !== 'en' && langue !== 'de') {
  langue = 'fr';
}

  fr: { logementTitre: "Mon Logement", logementDesc: "Vous êtes ici !", filtreCommerce: "Commerces", filtreTourisme: "Sites Touristiques", filtreResto: "Restaurant", boutonVisiter: "Visiter le site" },

const iconeBleue = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });

const marqueurLogement = L.marker([48.9691072, 7.9873084], { icon: iconeRouge }).addTo(maCarte);
marqueurLogement.bindPopup('<div style="text-align:center;font-family:sans-serif;"><h3 style="color:#ff4d4d;margin:0 0 10px 0;">' + texteUI.logementTitre + '</h3><p style="margin:0;color:#555;">' + texteUI.logementDesc + '</p></div>').openPopup();

const calqueTourisme = L.layerGroup().addTo(maCarte);

function genererContenuPopup(lieu) {
  let html = '<div style="text-align:center;font-family:sans-serif;">';
  html += '<h3 style="color:#ff4d4d;margin:0 0 10px 0;font-size:16px;">' + lieu.nom[langue] + '</h3>';
  if (lieu.image) { html += '<img src="' + lieu.image + '" style="width:100%;border-radius:8px;margin-bottom:10px;max-height:120px;object-fit:cover;" alt="">'; }
  if (lieu.desc && lieu.desc[langue]) { html += '<p style="margin:0 0 10px 0;color:#555;font-size:13px;">' + lieu.desc[langue] + '</p>'; }
  if (lieu.adresse) { html += '<p style="margin:0 0 5px 0;font-size:12px;color:#777;">📍 ' + lieu.adresse + '</p>'; }
  if (lieu.telephone) { html += '<p style="margin:0 0 10px 0;font-size:12px;color:#777;">📞 ' + lieu.telephone + '</p>'; }
  if (lieu.horaires && lieu.horaires[langue]) { html += '<p style="margin:0 0 10px 0;font-size:12px;color:#777;">🕒 ' + lieu.horaires[langue] + '</p>'; }
  if (lieu.site_web) { html += '<a href="' + lieu.site_web + '" target="_blank" style="display:inline-block;background-color:#ff4d4d;color:white;padding:8px 15px;text-decoration:none;border-radius:5px;font-weight:bold;font-size:13px;margin-top:5px;">' + texteUI.boutonVisiter + '</a>'; }
  html += '</div>';
  return html;
}

lieux.forEach(lieu => {
  let iconeChoisie = iconeVerte;
  let calqueCible = calqueCommerces;
  if (lieu.type === "tourisme") { iconeChoisie = iconeBleue; calqueCible = calqueTourisme; }
  else if (lieu.type === "resto") { iconeChoisie = iconeJaune; calqueCible = calqueResto; }
  const marqueur = L.marker([lieu.lat, lieu.lng], { icon: iconeChoisie });
  marqueur.bindPopup(genererContenuPopup(lieu));
  calqueCible.addLayer(marqueur);
});

const filtres = {};
filtres[texteUI.filtreCommerce] = calqueCommerces;
filtres[texteUI.filtreTourisme] = calqueTourisme;
filtres[texteUI.filtreResto] = calqueResto;
L.control.layers(null, filtres, { collapsed: false }).addTo(maCarte);
</script>
</body>
</html>
